<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="sanction.">
  <meta name="description" content="sanction. — your personal workspace.">
  <title>sanction.</title>
  <link rel="manifest" href="./manifest.webmanifest?v=3">
  <link rel="icon" type="image/png" sizes="1024x1024" href="./assets/sanction-icon-black.png">
  <link rel="apple-touch-icon" sizes="1024x1024" href="./assets/sanction-icon-black.png">
  <link rel="stylesheet" href="./styles.css?v=home-managers-1">
  <script src="./app.js?v=noter-lumi-1" defer></script>
</head>
<body>
  <main class="app" aria-label="sanction.">
    <section id="panel-home" class="panel panel-home" aria-labelledby="home-heading">
      <header class="page-title"><h1 id="home-heading">Sanction • Everything</h1></header>
      <div class="home-content">
        <div class="home-selector" role="listbox" aria-label="Choose your LUMI" aria-orientation="horizontal"></div>
      </div>
    </section>
    <section id="panel-call" class="panel" aria-label="Call" hidden>
      <img class="background" src="./assets/call.png" alt="" draggable="false">
    </section>
    <section id="panel-email" class="panel" aria-label="Email" hidden>
      <img class="background" src="./assets/email.png" alt="" draggable="false">
    </section>
    <section id="panel-clients" class="panel panel-editorial" aria-label="Clients" hidden>
      <img class="background" src="./assets/clients.png" alt="" draggable="false">
      <div class="scene-soft" aria-hidden="true">
        <img class="background" src="./assets/clients.png" alt="" draggable="false">
      </div>
      <header class="page-title"><h1>Clients • Management</h1></header>
      <div class="page-scroll" tabindex="0" aria-label="Clients management page">
        <div class="editorial-hero" aria-hidden="true"></div>
        <div class="editorial-content">
          <div class="edition-label">
            <span class="color-badge">BLUE</span>
            <span>CLIENTELE LUMI</span>
          </div>
          <p class="editorial-description">The space where all of your confirmed prospects are managed.</p>
          <img class="client-photo" src="./assets/client-photo.png" alt="Blue LUMI resting on a cobalt slab among dark sculptural objects." width="1290" height="2796" draggable="false">
          <section class="clients-section" aria-labelledby="clients-heading">
            <h2 id="clients-heading" aria-live="polite" aria-atomic="true"><span id="confirmed-count">Zero</span> confirmed <span id="confirmed-client-noun">clients</span>:</h2>
            <ul id="confirmed-clients" class="page-items" aria-label="Confirmed clients"></ul>
          </section>
        </div>
      </div>
    </section>
    <section id="panel-events" class="panel" aria-label="Events" hidden>
      <img class="background" src="./assets/events.png" alt="" draggable="false">
    </section>
    <section id="panel-notes" class="panel" aria-label="Notes" hidden>
      <img class="background" src="./assets/notes.png" alt="" draggable="false">
    </section>
    <nav class="tab-bar entry-bar" aria-label="Workspace navigation">
      <button id="workspace-enter" aria-controls="panel-clients">OPEN CLIENT MANAGER.</button>
    </nav>
  </main>
</body>
</html>
