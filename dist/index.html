<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="sanction.">
  <meta name="description" content="sanction. — your personal workspace.">
  <title>sanction.</title>
  <link rel="manifest" href="./manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" sizes="1024x1024" href="./assets/sanction-icon.png">
  <link rel="apple-touch-icon" sizes="1024x1024" href="./assets/sanction-icon.png">
  <link rel="preload" as="image" href="./assets/clients.png">
  <link rel="stylesheet" href="./styles.css?v=11">
  <script src="./app.js?v=5" defer></script>
</head>
<body>
  <main class="app" aria-label="sanction.">
    <section id="panel-call" class="panel" role="tabpanel" aria-labelledby="tab-call" hidden>
      <img class="background" src="./assets/call.png" alt="" draggable="false">
    </section>
    <section id="panel-email" class="panel" role="tabpanel" aria-labelledby="tab-email" hidden>
      <img class="background" src="./assets/email.png" alt="" draggable="false">
    </section>
    <section id="panel-clients" class="panel panel-editorial" role="tabpanel" aria-labelledby="tab-clients">
      <img class="background" src="./assets/clients.png" alt="" fetchpriority="high" draggable="false">
      <div class="scene-soft" aria-hidden="true">
        <img class="background" src="./assets/clients.png" alt="" draggable="false">
      </div>
      <header class="page-title"><h1>Clients • Management</h1></header>
      <div class="page-scroll" tabindex="0" aria-label="Clients management page">
        <div class="editorial-hero" aria-hidden="true"></div>
        <div class="editorial-content">
          <div class="edition-label">
            <span class="color-badge">BLUE</span>
            <span>CLIENTELE LUMI</span>
          </div>
          <p class="editorial-description">The space where all of your confirmed prospects are managed.</p>
          <img class="client-photo" src="./assets/client-photo.png" alt="Blue LUMI resting on a cobalt slab among dark sculptural objects." width="1290" height="2796" draggable="false">
          <section class="clients-section" aria-labelledby="clients-heading">
            <h2 id="clients-heading" aria-live="polite" aria-atomic="true"><span id="confirmed-count">Zero</span> confirmed <span id="confirmed-client-noun">clients</span>:</h2>
            <ul id="confirmed-clients" aria-label="Confirmed clients"></ul>
          </section>
        </div>
      </div>
    </section>
    <section id="panel-events" class="panel" role="tabpanel" aria-labelledby="tab-events" hidden>
      <img class="background" src="./assets/events.png" alt="" draggable="false">
    </section>
    <section id="panel-notes" class="panel" role="tabpanel" aria-labelledby="tab-notes" hidden>
      <img class="background" src="./assets/notes.png" alt="" draggable="false">
    </section>
    <nav class="tab-bar" role="tablist" aria-label="Workspace tabs">
      <button id="tab-call" role="tab" aria-selected="false" aria-controls="panel-call" tabindex="-1">CALL.</button>
      <button id="tab-email" role="tab" aria-selected="false" aria-controls="panel-email" tabindex="-1">EMAIL.</button>
      <button id="tab-clients" role="tab" aria-selected="true" aria-controls="panel-clients" tabindex="0">CLIENTS.</button>
      <button id="tab-events" role="tab" aria-selected="false" aria-controls="panel-events" tabindex="-1">EVENTS.</button>
      <button id="tab-notes" role="tab" aria-selected="false" aria-controls="panel-notes" tabindex="-1">NOTES.</button>
    </nav>
  </main>
</body>
</html>
