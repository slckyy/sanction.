name: One-time sanction. wallpaper resize
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resize-wallpapers-once.yml"
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image resizer
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Downscale originals to 430 by 932 without cropping
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          for name in ("call", "email", "clients", "events", "notes"):
              path = Path(name + ".png")
              with Image.open(path) as opened:
                  image = ImageOps.exif_transpose(opened)
                  if image.size != (1290, 2796):
                      raise RuntimeError(f"{path}: expected (1290, 2796), got {image.size}")
                  icc = image.info.get("icc_profile")
                  image = image.resize((430, 932), Image.Resampling.LANCZOS)
                  save_options = dict(format="PNG", optimize=True)
                  if icc:
                      save_options["icc_profile"] = icc
                  image.save(path, **save_options)
              with Image.open(path) as check:
                  assert check.size == (430, 932), (name, check.size)
              print(f"{path}: 1290x2796 -> 430x932")
          PY
      - name: Commit resized PNGs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- call.png email.png clients.png events.png notes.png
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 1
          fi
          git commit -m "Checkpoint: resize five sanction. wallpapers to 430x932"
          git push origin HEAD:main
